; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega4809]
platform = atmelmegaavr
board = ATmega4809
framework = arduino
monitor_speed = 9600
upload_protocol = arduino
board_build.f_cpu = 20000000L
build_flags = 
	-flto
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wl,-Map,${BUILD_DIR}/firmware.map,-V 
upload_flags = 
	-C
	$PROJECT_PACKAGES_DIR/tool-avrdude-megaavr/avrdude.conf
	-p
	$BOARD_MCU
	-P
	$UPLOAD_PORT
	-b
	$UPLOAD_SPEED
	-c
	arduino

check_tool = clangtidy

; Hardware-in-the-loop bench build: serial protocol on USART0, diagnosis off.
; Flash the sequencer firmware first if you want the production image back.
[env:bench]
extends = env:ATmega4809
monitor_speed = 115200
build_flags =
	-flto
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wl,-Map,${BUILD_DIR}/firmware.map,-V
	-DBENCH=1
	-DENABLE_DIAGNOSIS=0

[env:fuses_bootloader]
platform = atmelmegaavr
board = ATmega4809
framework = arduino
board_hardware.uart = uart0
board_build.f_cpu = 20000000L
upload_protocol = jtag2updi
lib_deps = 

[env:custom_fuses]
platform = atmelmegaavr
framework = arduino
board = ATmega4809
board_build.f_cpu = 20000000L
board_hardware.oscillator = external
upload_protocol = jtag2updi
lib_deps = 
